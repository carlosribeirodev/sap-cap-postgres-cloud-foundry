name: cap-postgres-lab
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lab_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run setup}
      REQUESTS_PASSWORD: ${REQUESTS_PASSWORD:?Execute npm run setup}
      ASSETS_PASSWORD: ${ASSETS_PASSWORD:?Execute npm run setup}
    ports:
      - "127.0.0.1:${PGPORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-apps.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  pgdata:
