<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>Ativos · BTP Lab</title>
  <link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="/">BTP <span>LAB</span></a><div class="account"><span id="user-name">Carregando usuário…</span><a href="/logout">Sair</a></div></header>
  <main>
    <div class="heading"><div><p class="eyebrow">APP B · ATIVOS</p><h1>Inventário de ativos</h1><p class="intro">Cadastre e acompanhe os equipamentos do laboratório.</p></div><span id="access-level" class="access">Verificando acesso</span></div>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <a id="login-again" href="/" hidden>Entrar novamente</a>
    <section id="create-panel" class="panel" aria-labelledby="form-title" hidden>
      <h2 id="form-title">Novo ativo</h2>
      <form id="asset-form">
        <label for="name">Nome <span class="required">obrigatório</span></label><input id="name" name="name" maxlength="120" required placeholder="Ex.: Notebook do laboratório">
        <label for="serial-number">Número de série <span class="optional">opcional</span></label><input id="serial-number" name="serialNumber" maxlength="80" placeholder="Ex.: LAB-001">
        <div class="form-footer"><button id="cancel-edit" type="button" class="secondary" hidden>Cancelar edição</button><button id="save-button" type="submit">Cadastrar ativo</button></div>
      </form>
    </section>
    <section class="panel" aria-labelledby="list-title">
      <div class="list-heading"><div><h2 id="list-title">Ativos cadastrados</h2><p id="count" class="muted">Carregando…</p></div><button id="refresh" type="button" class="secondary">Atualizar</button></div>
      <p id="empty" class="empty" hidden>Nenhum ativo cadastrado ainda.</p>
      <div id="asset-list" class="request-list" aria-busy="true"></div>
    </section>
    <footer>App B · Ativos · SAP BTP Lab</footer>
  </main>
</body>
</html>
