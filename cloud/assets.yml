applications:
  - name: cap-lab-assets
    path: ../apps/assets/gen/srv
    memory: 256M
    disk_quota: 512M
    buildpacks: [nodejs_buildpack]
    routes:
      - route: cap-lab-assets-((route_suffix)).((domain))
    health-check-type: http
    health-check-http-endpoint: /health
    services:
      - name: cap-lab-credentials
        parameters:
          authorization:
            default_permissions: []
            namespace_permissions:
              cap-lab-assets-runtime: [read]
      - cap-lab-requests-auth
    env:
      NODE_ENV: production
      cds_requires_db_pool_max: 5
      CAP_LAB_DOMAIN: assets
      CAP_LAB_DB_ROLE: runtime
