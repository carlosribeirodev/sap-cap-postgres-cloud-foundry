applications:
  - name: cap-lab-requests-deployer
    path: ../apps/requests/gen/pg
    memory: 256M
    disk_quota: 512M
    no-route: true
    buildpacks:
      - nodejs_buildpack
    services:
      - cap-lab-requests-deploy-db
    env:
      NODE_ENV: production
      cds_requires_db_kind: postgres
      cds_requires_db_vcap_name: cap-lab-requests-deploy-db
      cds_requires_db_vcap_label: user-provided
