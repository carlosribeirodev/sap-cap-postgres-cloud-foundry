applications:
  - name: cap-lab-assets-deployer
    path: ../apps/assets/gen/pg
    memory: 256M
    disk_quota: 512M
    no-route: true
    buildpacks: [nodejs_buildpack]
    services: [cap-lab-assets-deploy-db]
    env:
      NODE_ENV: production
      cds_requires_db_kind: postgres
      cds_requires_db_vcap_name: cap-lab-assets-deploy-db
      cds_requires_db_vcap_label: user-provided
