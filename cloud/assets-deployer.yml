applications:
  - name: cap-lab-assets-deployer
    path: ../apps/assets/gen/pg
    memory: 256M
    disk_quota: 512M
    no-route: true
    buildpacks: [nodejs_buildpack]
    services:
      - name: cap-lab-credentials
        parameters:
          authorization:
            default_permissions: []
            namespace_permissions:
              cap-lab-assets-deployer: [read]
    env:
      NODE_ENV: production
      cds_requires_db_kind: postgres
      CAP_LAB_DOMAIN: assets
      CAP_LAB_DB_ROLE: deployer
